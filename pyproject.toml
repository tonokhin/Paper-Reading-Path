[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reading-path"
version = "0.1.0"
description = "Generate a reading sequence from local research paper PDFs using citation relationships."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
]

[project.scripts]
paper-reading-path = "paper_reading_path.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
